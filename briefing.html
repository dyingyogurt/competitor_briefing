<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一将成名竞品日报</title>
    <style>
        :root {
            --bg: #f6f7f9;
            --surface: #ffffff;
            --surface-2: #f8f9fb;
            --surface-3: #f2f4f7;
            --text: #111827;
            --text-secondary: #4b5563;
            --muted: #6b7280;
            --accent: #1e5ad8;
            --accent-light: #eef4ff;
            --border: #e5e7eb;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 22px;
            --shadow-card: 0 1px 2px rgba(0,0,0,0.04), 0 10px 30px rgba(0,0,0,0.06);
            --shadow-hover: 0 4px 12px rgba(0,0,0,0.08);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f1115;
                --surface: #1a1d23;
                --surface-2: #20242c;
                --surface-3: #252a33;
                --text: #f3f4f6;
                --text-secondary: #d1d5db;
                --muted: #9ca3af;
                --accent: #4b8df8;
                --accent-light: #1e293b;
                --border: #2d3139;
            }
        }
        * { box-sizing: border-box; }
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        .app-layout {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .left-nav {
            width: 200px;
            flex-shrink: 0;
            background: var(--surface);
            border-right: 1px solid var(--border);
            padding: 18px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .brand {
            font-size: 1rem;
            font-weight: 800;
            color: var(--accent);
            line-height: 1.4;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .brand-icon {
            font-size: 1.2rem;
            flex-shrink: 0;
        }
        .nav-btn {
            width: 100%;
            text-align: left;
            padding: 10px 12px;
            border: none;
            border-radius: var(--radius-sm);
            background: transparent;
            color: var(--muted);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
        }
        .nav-btn .nav-icon { font-size: 1rem; }
        .nav-btn:hover { background: var(--accent-light); }
        .nav-btn.active {
            background: var(--accent-light);
            color: var(--accent);
        }
        .nav-btn.active::before {
            content: "";
            position: absolute;
            left: -16px;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 20px;
            background: var(--accent);
            border-radius: 0 2px 2px 0;
        }
        .history-select {
            display: none;
            width: 100%;
            padding: 8px 10px;
            margin-top: 6px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            background: var(--surface);
            color: var(--text);
            cursor: pointer;
        }
        .main-area {
            flex: 1;
            display: flex;
            overflow: hidden;
            padding: 16px;
        }
        .viewer-wrap {
            flex: 1;
            padding: 0;
            overflow: auto;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: var(--radius-lg);
            background: var(--surface);
            box-shadow: var(--shadow-card);
        }
        .right-index {
            width: 180px;
            flex-shrink: 0;
            background: var(--surface);
            border-left: 1px solid var(--border);
            padding: 18px 16px;
            overflow-y: auto;
        }
        .index-title {
            font-size: 0.72rem;
            font-weight: 800;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 12px;
        }
        .index-btn {
            display: block;
            width: 100%;
            text-align: left;
            padding: 10px 12px;
            margin-bottom: 8px;
            border: none;
            border-radius: var(--radius-sm);
            background: var(--surface-2);
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }
        .index-btn:hover {
            background: var(--accent-light);
            color: var(--accent);
        }
        .index-btn.active {
            background: var(--accent);
            color: #ffffff;
            font-weight: 600;
        }
        .index-btn.active:hover {
            background: var(--accent);
            color: #ffffff;
        }
        .empty-state {
            display: none;
            padding: 64px 24px;
            text-align: center;
            color: var(--muted);
            background: var(--surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
        }
        .empty-state h3 {
            margin: 0 0 8px;
            color: var(--text);
            font-size: 1rem;
        }
        .empty-state p {
            margin: 0;
            font-size: 0.85rem;
            line-height: 1.5;
        }
        @media (max-width: 900px) {
            .right-index { display: none; }
        }
        @media (max-width: 640px) {
            .app-layout { flex-direction: column; }
            .left-nav {
                width: 100%;
                flex-direction: row;
                flex-wrap: wrap;
                border-right: none;
                border-bottom: 1px solid var(--border);
                padding: 14px;
                gap: 8px;
            }
            .brand { width: 100%; margin-bottom: 4px; font-size: 0.95rem; }
            .nav-btn {
                width: auto;
                padding: 8px 12px;
            }
            .nav-btn.active::before { display: none; }
            .history-select { width: auto; min-width: 140px; margin-top: 0; }
            .main-area { height: calc(100vh - 130px); padding: 10px; }
        }
        @media (max-width: 480px) {
            .left-nav { padding: 12px; }
            .brand { font-size: 0.9rem; }
            .main-area { height: calc(100vh - 120px); padding: 8px; }
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <aside class="left-nav">
            <div class="brand"><span class="brand-icon">📊</span> 一将成名竞品日报</div>
            <button class="nav-btn active" data-mode="today"><span class="nav-icon">📅</span> 每日日报</button>
            <button class="nav-btn" data-mode="history"><span class="nav-icon">📜</span> 历史日报</button>
            <select class="history-select" id="history-select"></select>
        </aside>
        <div class="main-area">
            <div class="viewer-wrap">
                <div class="empty-state" id="empty-state">
                    <h3>暂无日报</h3>
                    <p>请运行项目根目录的 <strong>双击运行.bat</strong><br>生成今日简报后再刷新本页。</p>
                </div>
                <iframe id="viewer" src="history/briefing_2026-08-17.html"></iframe>
            </div>
            <aside class="right-index" id="right-index">
                <div class="index-title">游戏索引</div>
                <div id="index-list"></div>
            </aside>
        </div>
    </div>
    <div id="history-data" data-dates='["2026-08-17", "2026-08-11"]' style="display:none"></div>
    <script src="viewer.js"></script>
</body>
</html>
