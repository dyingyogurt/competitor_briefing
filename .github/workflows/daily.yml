name: Daily Competitor Briefing

on:
  schedule:
    # 每天北京时间 09:00 执行（UTC 01:00）
    - cron: '0 1 * * *'
  workflow_dispatch:

# 防止多个部署任务冲突
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Generate daily briefing
        run: python main.py
        env:
          # 可选：如果有 webhook，填到仓库 Secrets 里即可自动告警
          COMPETITOR_ALERT_WEBHOOK_URL: ${{ secrets.COMPETITOR_ALERT_WEBHOOK_URL }}

      - name: Commit and push results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # .gitignore 里忽略了这些生成目录，但日报产物需要进仓库才能让 Edge 扩展读到
          git add -f output/
          git add -f edge-extension/history/
          git add -f edge-extension/briefing.html
          git add -f edge-extension/last_run_status.json
          git add -f data/history.json
          git diff --cached --quiet || git commit -m "daily: auto generate briefing for $(date +%Y-%m-%d)"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 把 edge-extension 作为 Pages 站点根目录
          path: edge-extension

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
