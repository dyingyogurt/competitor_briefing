name: Daily Competitor Briefing

on:
  schedule:
    # 每天北京时间 09:00 执行（UTC 01:00）
    - cron: '0 1 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

# 防止多个部署任务冲突
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository (main)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch existing history from gh-pages
        run: |
          git fetch origin gh-pages
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            mkdir -p data
            git show origin/gh-pages:data/history.json > data/history.json 2>/dev/null || true
            echo "Loaded existing history.json from gh-pages"
          else
            echo "No gh-pages branch yet, starting fresh"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Generate daily briefing
        run: python main.py
        env:
          # 可选：如果有 webhook，填到仓库 Secrets 里即可自动告警
          COMPETITOR_ALERT_WEBHOOK_URL: ${{ secrets.COMPETITOR_ALERT_WEBHOOK_URL }}

      - name: Deploy Pages site to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./edge-extension
          force_orphan: false
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'daily: update Pages site for ${{ github.run_id }}'

      - name: Save data/history.json back to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./data
          destination_dir: ./data
          force_orphan: false
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'daily: update history.json for ${{ github.run_id }}'
